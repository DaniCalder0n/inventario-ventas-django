{% extends 'partials/base.html' %}
{% block title %}Actualizar Stock{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <h5 class="fw-bold mb-1">Actualizar Stock</h5>
        <p class="text-muted mb-3">{{ product.name }} — Stock actual: <strong>{{ product.stock }}</strong></p>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3"><label class="form-label fw-medium">Tipo de movimiento</label>{{ form.movement_type }}</div>
          <div class="mb-3"><label class="form-label fw-medium">Cantidad</label>{{ form.quantity }}</div>
          <div class="mb-3"><label class="form-label fw-medium">Notas</label>{{ form.notes }}</div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn text-white" style="background:#FD7B03;">Actualizar</button>
            <a href="{% url 'inventory_list' %}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
