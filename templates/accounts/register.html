{% extends 'partials/base.html' %}
{% block title %}Registro{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h4 class="mb-4 text-center fw-bold" style="color:#4BA609;"><i class="bi bi-person-plus"></i> Crear cuenta</h4>
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
          <div class="mb-3">
            <label class="form-label fw-medium">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<div class="text-danger small">{{ field.errors|join:", " }}</div>{% endif %}
          </div>
          {% endfor %}
          <button type="submit" class="btn w-100 text-white fw-bold" style="background:#4BA609;">Registrarse</button>
        </form>
        <div class="text-center mt-3">
          <a href="{% url 'login' %}" class="small" style="color:#FD7B03;">Ya tengo cuenta</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
